name:                catln
version:             0.1.0.0
github:              "zachgk/catln"
license:             MIT
author:              "Zach Kimberg"
maintainer:          "zachary@kimberg.com"
copyright:           "2019 Zach Kimberg"

extra-source-files:
- README.md
- ChangeLog.md

# Metadata used when publishing your package
# synopsis:            Short description of your package
# category:            Web

# To avoid duplicated efforts in documentation and dealing with the
# complications of embedding Haddock markup inside cabal files, it is
# common to point users to the README.md file.
description:         Please see the README on GitHub at <https://github.com/zachgk/catln#readme>

default-extensions:
- OverloadedStrings
- TupleSections
- NamedFieldPuns

# Deps from stackage - https://www.stackage.org/lts-21.25
dependencies:
- base
- mtl
- haskeline
- containers
  # - llvm-hs==0.9.0.1
  # - llvm-hs-pure==9.0.1
- directory
- bytestring
- utf8-string
- megaparsec
- mmark
- feed
- http-conduit
- text
- time
- stm
- fsnotify
- parser-combinators
- haskeline
- unordered-containers
- transformers
- split
- hspec
- hedgehog
- tasty
- tasty-hunit
- tasty-hedgehog
- hashable
- pretty-simple
- tuple
- semialign
- aeson
- scientific
- scotty
- optparse-applicative
- http-types
- wai-middleware-static
- stringbuilder
- filepath
- tree-sitter
- tree-sitter-haskell
- tree-sitter-python
- ghc-lib-parser
- uuid
- lsp
- lsp-types
- process

library:
  source-dirs: src

executables:
  catln:
    main:                Main.hs
    source-dirs:         app
    ghc-options:
      # - -threaded
      # - -rtsopts
      # - -with-rtsopts=-N
    - -threaded
    - -Wall
    dependencies:
    - catln

tests:
  catln-test:
    main:                Spec.hs
    source-dirs:
      - test
      - src
    ghc-options:
      # - -threaded
      # - -with-rtsopts=-N
      - -threaded
      - -rtsopts
      - -Wall
      # An async exception is only delivered at a yield point, and GHC omits yield points
      # from loops that do not allocate. 'forceTimed' wraps every property stage in a 5s
      # `timeout`, but a non-allocating livelock in the type algebra never reaches a point
      # where that exception can land: one such run spun for 10h22m at a FLAT 941MB
      # residency, ignoring its own budget, and only ended when the process was killed.
      # This restores the yield points so the existing budget actually fires and hedgehog
      # can shrink the offending input.
      #
      # Test-only, and free for production: this suite compiles `src` itself (see
      # source-dirs above), so the library code linked into the test binary gets the flag
      # while the `library` and `catln` stanzas are untouched.
      - -fno-omit-yields
      # A hard heap cap turns a runaway ALLOCATION into a HeapOverflow exception — which
      # hedgehog reports as a failing property with a shrunk counterexample — instead of
      # exhausting a swapless 15GB machine. One such run required a physical restart.
      - "-with-rtsopts=-M6G"
    # dependencies:
      # - catln
